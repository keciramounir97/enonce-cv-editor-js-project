# Mini-projet : éditeur de CV en une page

**Matière :** HTML / CSS / JavaScript
**Niveau :** 2ᵉ année développement web (ou équivalent)
**Durée indicative :** 3 à 4 semaines (travail individuel ou binôme)
**Livrable :** application web front-end, sans serveur obligatoire

## 1. Énoncé

### 1.1 Contexte

Les recruteurs lisent un CV en quelques secondes. Un CV clair, d’**une seule page A4**, bien mis en page, augmente les chances d’être lu.

Vous devez concevoir un **éditeur de CV dans le navigateur**. L’utilisateur saisit ses informations à gauche ; à droite, une **feuille A4** se met à jour en direct. Il peut ensuite exporter le résultat en **PDF** ou **DOCX**, l’imprimer, ou l’ouvrir dans une **nouvelle fenêtre**.

### 1.2 Objectif pédagogique

À la fin du projet, vous serez capable de :

- structurer une interface en HTML sémantique ;
- concevoir une mise en page professionnelle (Flexbox / Grid, variables CSS, thème clair / sombre) ;
- gérer un état applicatif en JavaScript (données, listes dynamiques, i18n) ;
- générer du HTML à partir de données et le synchroniser avec des formulaires ;
- exporter un document (impression / PDF / Word) ;
- persister des données dans `localStorage`.

### 1.3 Ce que l’application doit produire

Une application **100 % front-end** qui permet de rédiger, styliser et exporter un CV **toujours sur une seule page A4**, **visuellement identique** à [cv-editor-chi.vercel.app](https://cv-editor-chi.vercel.app/).

---

## 2. Cahier des charges fonctionnel

### 2.1 Principes généraux

Toutes les exigences ci-dessous sont **obligatoires**.

- **F01** — L’interface tient sur **un seul écran** : barre latérale à **gauche**, aperçu du CV à **droite**.
- **F02** — Toute modification dans le formulaire se reflète **immédiatement** dans l’aperçu.
- **F03** — Le CV tient **toujours sur une page A4** (210 × 297 mm).
- **F04** — Un **bouton principal** est collé **en bas** de la barre latérale.
- **F05** — Le design du CV est **minimaliste** (typo soignée, peu de couleurs, pas d’emojis dans le CV).
- **F06** — Les icônes du CV (e-mail, téléphone, lieu, site) sont des **SVG**, pas des emojis.
- **F07** — Le rendu doit **matcher la démo** : mêmes familles de blocs, mêmes contrôles, même hiérarchie visuelle.

### 2.2 Barre latérale (gauche)

La barre est **défilable**. Le pied (bouton principal) **reste visible**.

Blocs à prévoir, **dans le même esprit que la démo** :

1. Identité de l’app (logo **CV** + titre + sous-titre)
2. Apparence
3. Mise en forme / Design
4. Informations personnelles
5. Contact
6. Profil / résumé
7. Expérience
8. Formation
9. Compétences et langues
10. Sections personnalisées
11. Export

**Pied de barre (fixe) :** bouton **Ouvrir dans une nouvelle fenêtre**.

Vérifier sur la démo : le bouton du bas ne défile **pas** avec le formulaire.

### 2.3 Apparence

À tester sur la démo, puis à reproduire.

- **F10 — Thème clair / sombre**
  Bascule. L’interface **et** la feuille CV changent. En sombre, la **feuille A4** est sombre aussi.

- **F11 — Langue de l’interface**
  Au minimum : **français, anglais, arabe**. Bonus (comme la démo) : espagnol, allemand.

- **F12 — Sens du texte**
  Boutons **LTR** et **RTL**. L’arabe active le RTL par défaut. La barre reste à **gauche**.

- **F13 — Exemple localisé**
  Bouton pour charger un CV d’exemple dans la langue choisie (avec confirmation si l’utilisateur a déjà saisi du texte).

Quand on change de langue :

- les libellés de l’éditeur se traduisent ;
- les titres de sections du CV (Profil, Expérience, etc.) se traduisent aussi ;
- le contenu déjà saisi **n’est pas écrasé**, sauf si on charge l’exemple.

### 2.4 Mise en forme du CV

Reproduire les contrôles **Design** de la démo.

- **F20 — Police** — Liste de polices (sans-serif et serif). Au moins une police adaptée à l’arabe.
- **F21 — Taille du texte** — Curseur (ex. 8 à 16 pt) avec valeur affichée.
- **F22 — Interligne** — Curseur (ex. 1,2 à 1,8) avec valeur affichée.
- **F23 — Ajuster à une page** — **On / Off**. Si On : réduire automatiquement la taille pour que tout tienne. Si Off : appliquer la taille choisie.
- **F24 — Couleurs du thème** — Palette **claire** et palette **sombre** indépendantes.
- **F25 — Réinitialiser les couleurs** — Remet la palette du thème actuel aux valeurs par défaut.
- **F26 — Styles par section** — Pour l’en-tête, le profil, l’expérience, la formation, les compétences, les langues et chaque section perso : couleur du titre, couleur du texte, échelle de taille (%), police optionnelle.

Couleurs minimales à personnaliser :

- fond de page
- nom et titres
- accent (intitulé du poste)
- texte principal
- descriptions
- texte secondaire
- bordures
- ligne d’en-tête
- pastilles (texte, bordure, fond)

### 2.5 Contenu du CV

- **F30 — Personnel** — Nom complet, intitulé du poste.
- **F31 — Contact** — E-mail, téléphone, ville, site web.
- **F32 — Profil** — Zone de texte longue.
- **F33 — Expérience** — Liste dynamique : poste, entreprise, début, fin, description. Ajouter / supprimer.
- **F34 — Formation** — Liste dynamique : diplôme, établissement, début, fin. Ajouter / supprimer.
- **F35 — Compétences** — Une ligne, éléments séparés par des virgules → pastilles.
- **F36 — Langues** — Même principe.
- **F37 — Sections perso** — Titre + contenu. Ajouter / supprimer (Projets, Prix, Bénévolat…).

Champs vides : **ne pas afficher** la ligne ou la section correspondante.

### 2.6 Syntaxe dans les textes longs

Dans le profil, les descriptions d’expérience et les sections perso :

- `# Titre` → titre
- `## Sous-titre` → sous-titre
- `---` → ligne horizontale
- `- item` → puce
- ligne vide → espace vertical

Afficher un **rappel** de cette syntaxe sous les zones concernées, comme sur la démo.

### 2.7 Aperçu (droite)

- **F40** — Feuille de **210 × 297 mm**, ombre légère, fond de la palette active.
- **F41** — En-tête : nom (très visible), poste (couleur d’accent), contacts avec icônes SVG.
- **F42** — Sections avec titre en petites capitales et filet fin.
- **F43** — Expérience / formation : titre à gauche, dates à droite.
- **F44** — Compétences / langues : pastilles.
- **F45** — Le fond autour de la feuille est distinct (grille discrète autorisée, comme la démo).

### 2.8 Export et nouvelle fenêtre

Tester chaque bouton sur la démo, puis implémenter le même comportement.

- **F50 — Enregistrer PDF** — Fichier `.pdf` A4. Conserve thème, polices, couleurs.
- **F51 — Enregistrer DOCX** — Fichier `.docx` ouvrable dans Word. Conserve le contenu, le thème, le RTL si besoin.
- **F52 — Imprimer** — Dialogue d’impression. **Pas** de barre latérale. **Pas** d’URL / date / « about:blank 1/1 ». Marges `@page` à 0, padding interne. Fond coloré imprimé (`print-color-adjust: exact`).
- **F53 — Nouvelle fenêtre** — HTML autonome du CV + bouton Imprimer. Même thème et même direction.

Le thème **sombre reste sombre** à l’écran, à l’impression et dans le PDF.

### 2.9 Persistance

- **F60** — Sauvegarder automatiquement (thème, langue, direction, design, textes, listes).
- **F61** — Au rechargement, tout revient.
- **F62** — Rien n’est perdu si on ferme l’onglet.

À tester sur la démo : changer un champ, recharger, vérifier que ça reste.

## 3. Cahier des charges technique

### 3.1 Contraintes

- **Langages :** HTML5, CSS3, JavaScript uniquement (pas de React, Vue, Angular, jQuery).
- **Fichiers :** au minimum `index.html`, `styles.css`, `app.js`.
- **Serveur :** aucun back-end obligatoire.
- **Bibliothèques :** CDN autorisé pour polices Google Fonts, **html2canvas**, **jsPDF**, **JSZip**.
- **Accessibilité :** labels liés aux champs, contrastes lisibles, focus visible.
- **Responsive :** bonus sous 900 px, barre au-dessus, aperçu en dessous (comme la démo).
- **Qualité :** pas d’erreurs console. Noms clairs. Commentaires utiles, pas de roman.

### 3.2 Architecture imposée

```
cv-editor/
├── index.html
├── styles.css
├── app.js
└── README.md
```

- `index.html` : structure
- `styles.css` : thème, barre, feuille A4, impression
- `app.js` : état, rendu, i18n, export, `localStorage`

### 3.3 Structure HTML attendue

```html
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-scroll">… formulaires …</div>
    <div class="sidebar-footer">
      <button>Ouvrir dans une nouvelle fenêtre</button>
    </div>
  </aside>
  <main class="stage">
    <div class="page">
      <div class="cv" id="cv"></div>
    </div>
  </main>
</div>
```

La mise en page globale reste **LTR** (barre toujours à gauche). Seul le **contenu** (formulaire + CV) suit LTR / RTL.

### 3.4 Données (modèle)

Organiser un objet d’état du type :

- `state` : theme, lang, dir
- `design` : font, fontSize, lineHeight, autoFit, palettes, sections
- `experience` : liste `{ role, company, start, end, desc }`
- `education` : liste `{ degree, school, start, end }`
- `custom` : liste `{ title, content }`
- `fields` : name, title, email, phone, location, website, summary, skills, langs

Le CV n’est **pas** du HTML figé : il est **généré** en JavaScript à chaque modification.

### 3.5 CSS

- Variables CSS (`--bg`, `--text`, `--accent`, `--cv-bg`, etc.)
- `html[data-theme="dark"]` pour le thème sombre
- Feuille : `width: 210mm; height: 297mm; overflow: hidden`
- Impression :
  - `@page { size: A4; margin: 0; }`
  - masquer `.sidebar`
  - `print-color-adjust: exact`
  - padding interne ~14 mm

### 3.6 JavaScript — points clés

1. **Échappement HTML** de tout texte utilisateur (`<`, `>`, `&`…).
2. **Délégation d’événements** pour les listes dynamiques.
3. **Ajustement une page** : plus grande taille de police qui tient encore.
4. **i18n** : objet de traductions ; libellés en `data-i18n`.
5. **PDF** : html2canvas + jsPDF ; repli `window.print()`.
6. **DOCX** : JSZip + XML OOXML, ou à défaut HTML en `.doc` (à noter dans le README).
7. **Nouvelle fenêtre** : `window.open` + HTML autonome.

### 3.7 Interdictions

- Copier-coller un dépôt existant
- Inspecter / copier le code **depuis la démo Vercel** ([cv-editor-chi.vercel.app](https://cv-editor-chi.vercel.app/)). Pour lire une implémentation, utilisez le dépôt du professeur : [github.com/keciramounir97/cv-editor](https://github.com/keciramounir97/cv-editor).
- Emojis dans le CV (icônes SVG uniquement)
- Framework JS
- Backend / base de données
- Plusieurs pages HTML pour l’éditeur

## 5. Comment utiliser la démo (sans voir le code)

1. Ouvrir [https://cv-editor-chi.vercel.app/](https://cv-editor-chi.vercel.app/)
2. Noter l’écran : barre gauche, feuille A4 droite, bouton du bas.
3. Cliquer **Dark** : l’éditeur **et** le CV doivent noircir.
4. Changer la langue (FR, EN, AR…) : seuls les libellés changent, sauf si vous chargez l’exemple.
5. Passer en **RTL** : le texte s’aligne à droite, la barre reste à gauche.
6. Ajouter / supprimer une expérience, une formation, une section.
7. Taper `# Titre`, `---` et `- item` dans le profil.
8. Déplacer les curseurs police / interligne, activer ou non « Fit to one page ».
9. Exporter PDF, DOCX, imprimer, ouvrir une nouvelle fenêtre.
10. Recharger la page : les données doivent revenir.

**Règle :** si vous ne savez pas comment coder une fonction, **retestez-la dans la démo**. Pour voir le code du professeur : [https://github.com/keciramounir97/cv-editor](https://github.com/keciramounir97/cv-editor).

## 6. Planning conseillé

- **Semaine 1** — Maquette HTML/CSS calquée sur la démo : barre + feuille A4, thème clair/sombre, formulaire personnel + aperçu lié
- **Semaine 2** — Listes dynamiques, syntaxe `# / --- / -`, LTR/RTL, i18n (FR + EN + AR)
- **Semaine 3** — Ajustement une page, couleurs, polices, `localStorage`
- **Semaine 4** — PDF, impression propre, DOCX, nouvelle fenêtre, README, comparaison visuelle avec la démo

---

## 7. Livrables

1. Dossier du projet (`index.html`, `styles.css`, `app.js`, `README.md`)
2. README : lancement, fonctionnalités, CDN utilisés, limites
3. Démonstration orale / vidéo : CV rempli, thème sombre, RTL arabe, export PDF **et** DOCX, comparaison avec la démo
4. (Optionnel) mise en ligne (GitHub Pages / Netlify / Vercel)

## 8. Critères d’évaluation (20 points)

- **Ressemblance avec la démo + structure HTML/CSS — 4 pts**
  Même écran, barre gauche, A4 droite, bouton en bas, variables, thème.

- **Formulaire et aperçu live — 4 pts**
  Tous les blocs, listes + / −, champs vides masqués.

- **Thème, langue, RTL — 3 pts**
  Clair/sombre sur le CV, 3 langues minimum, RTL correct.

- **Une page A4 — 2 pts**
  Rien ne déborde ; option auto-fit.

- **Export — 3 pts**
  PDF + impression sans en-têtes ; DOCX ou `.doc` ; nouvelle fenêtre.

- **Persistance et qualité — 2 pts**
  `localStorage`, pas d’erreurs, code lisible, écrit par l’élève.

- **Soin visuel — 2 pts**
  CV professionnel, icônes SVG, pas d’emojis, fidèle à la démo.

**Bonus (jusqu’à +3, plafonné à 20) :** 5 langues, styles par section, PDF fidèle au sombre, polices arabes, version mobile.

**Pénalités :** copier-coller le projet du professeur sans le comprendre, inspection de la démo Vercel, emojis dans le CV, framework interdit, CV sur 2 pages, interface trop différente de la démo.

## 9. Tests de recette

Cocher **après avoir comparé avec** [https://cv-editor-chi.vercel.app/](https://cv-editor-chi.vercel.app/) :

- L’écran ressemble à la démo (barre, A4, bouton du bas)
- Je tape mon nom : il change à droite sans recharger
- J’ajoute 3 expériences, j’en supprime une
- Je passe en sombre : la **feuille** est sombre
- Je recharge : tout est encore là
- Je passe en arabe + RTL : textes à droite, barre toujours à gauche
- J’écris `---` et `- item` : trait et puces apparaissent
- Beaucoup de texte : tout reste sur **une** page
- PDF = 1 page, fond sombre si thème sombre
- Impression : pas d’URL, pas de « 1/1 »
- DOCX s’ouvre dans Word

## 10. Conseils (sans donner la solution)

- Une fonction `renderCV()` reconstruit l’intérieur de `#cv`.
- `localStorage` à chaque `input` (éventuellement avec un petit délai).
- Auto-fit : tant que `scrollHeight > clientHeight`, diminuer `font-size`.
- Impression : marges dans le padding de `.page`, pas dans `@page`.
- PDF sombre : `print-color-adjust: exact`.
- En cas de doute sur un bouton ou un écran : **retourner sur la démo et retester**.

<script>
(function () {
  var src = document.getElementById('md').value;
  var out = document.getElementById('doc');
  function fallback(md) {
    return md
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^### (.*)$/gm, '<h3>$1</h3>')
      .replace(/^## (.*)$/gm, '<h2>$1</h2>')
      .replace(/^# (.*)$/gm, '<h1>$1</h1>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^/, '<p>').replace(/$/, '</p>');
  }
  try {
    if (window.marked && window.marked.parse) {
      window.marked.setOptions({ gfm: true, breaks: false });
      out.innerHTML = window.marked.parse(src);
    } else {
      out.innerHTML = fallback(src);
    }
  } catch (e) {
    out.innerHTML = fallback(src);
  }
})();
</script>
